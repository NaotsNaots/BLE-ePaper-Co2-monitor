; Seeed XIAO nRF52840 Sense — Arduino / Adafruit nRF52 core
; https://wiki.seeedstudio.com/xiao_nrf52840_with_platform_io/
; オプション自己診断: build_flags = -D SGP40_RUN_SELFTEST

[env:seeed_xiao_nrf52840_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
monitor_speed = 115200
lib_deps =
  sensirion/Sensirion I2C SGP40
  sensirion/Sensirion Gas Index Algorithm
  zinggjm/GxEPD2@^1.5.9
  adafruit/Adafruit GFX Library
  adafruit/Adafruit BusIO
  adafruit/Adafruit LSM6DS
  adafruit/Adafruit Unified Sensor
; upload_port / monitor_port は書かない

; ---------------------------------------------------------------------------
; ハード単体テスト（いずれか一方だけビルド・書き込み）
;   SGP40 のみ: pio run -e test_sgp40_only -t upload && pio device monitor -e test_sgp40_only
;   e-Paper のみ: pio run -e test_epaper_only -t upload && pio device monitor -e test_epaper_only
; ---------------------------------------------------------------------------
[env:test_sgp40_only]
extends = env:seeed_xiao_nrf52840_sense
src_dir = test/hw/sgp40_only

[env:test_epaper_only]
extends = env:seeed_xiao_nrf52840_sense
src_dir = test/hw/epaper_only
