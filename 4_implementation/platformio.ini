; Seeed XIAO nRF52840 Sense — Arduino / Adafruit nRF52 core
; https://wiki.seeedstudio.com/xiao_nrf52840_with_platform_io/
; オプション自己診断: build_flags = -D SGP40_RUN_SELFTEST

[env:seeed_xiao_nrf52840_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/hw_test_src_dir.py
lib_deps =
  sensirion/Sensirion I2C SGP40
  sensirion/Sensirion Gas Index Algorithm
  zinggjm/GxEPD2@^1.5.9
  adafruit/Adafruit GFX Library
  adafruit/Adafruit BusIO
  adafruit/Adafruit LSM6DS
  adafruit/Adafruit Unified Sensor
; upload_port / monitor_port は書かない

; ---------------------------------------------------------------------------
; ハード単体テスト（いずれか一方だけビルド・書き込み）
;   SGP40 のみ: pio run -e test_sgp40_only -t upload && pio device monitor -e test_sgp40_only
;   e-Paper のみ: pio run -e test_epaper_only -t upload && pio device monitor -e test_epaper_only
; ---------------------------------------------------------------------------
; 表示確認: 4 種類の画面（学習中・OK・そろそろ・換気して）を順に描いてから通常動作に入る
[env:demo_display]
extends = env:seeed_xiao_nrf52840_sense
build_flags = -D DISPLAY_DEMO

[env:test_sgp40_only]
extends = env:seeed_xiao_nrf52840_sense

; SGP40 ヒーター再投入後の安定時間: pio run -e test_sgp40_coldstart -t upload
[env:test_sgp40_coldstart]
extends = env:seeed_xiao_nrf52840_sense

[env:test_epaper_only]
extends = env:seeed_xiao_nrf52840_sense

; ---------------------------------------------------------------------------
; 層2: ハード単体テスト（新規追加）
;   IMU ウェーク: pio run -e test_imu_wake -t upload && pio device monitor -e test_imu_wake
;   BLE 広告:    pio run -e test_ble_adv  -t upload && pio device monitor -e test_ble_adv
; ---------------------------------------------------------------------------
[env:test_imu_wake]
extends = env:seeed_xiao_nrf52840_sense

[env:test_ble_adv]
extends = env:seeed_xiao_nrf52840_sense
lib_extra_dirs = src
build_flags =
  -Isrc
  -Iinclude
  -I${platformio.packages_dir}/framework-arduinoadafruitnrf52/libraries/Adafruit_TinyUSB_Arduino/src

; ---------------------------------------------------------------------------
; 層3: スリープ・ウェークサイクル通しテスト（RTC=5秒に短縮）
;   pio run -e test_sleep_cycle -t upload && pio device monitor -e test_sleep_cycle
; ---------------------------------------------------------------------------
[env:test_sleep_cycle]
extends = env:seeed_xiao_nrf52840_sense
lib_extra_dirs = src
build_flags =
  -Isrc
  -Iinclude
  -I${platformio.packages_dir}/framework-arduinoadafruitnrf52/libraries/Adafruit_TinyUSB_Arduino/src

; ---------------------------------------------------------------------------
; 層1: Native unit test（PC 上で実行、ハード不要）
;   Eco2Mapper: pio test -e native_eco2mapper
;   StateMachine: pio test -e native_statemachine
; ---------------------------------------------------------------------------
[env:native_eco2mapper]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -Iinclude -Isrc -Isrc/sensor
build_src_filter = -<*> +<sensor/Eco2Mapper.cpp>
test_filter = test_eco2mapper

[env:native_statemachine]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -Iinclude -Isrc
build_src_filter = -<*> +<app/StateMachine.cpp>
test_filter = test_statemachine
